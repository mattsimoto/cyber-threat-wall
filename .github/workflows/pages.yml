name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Update threat data"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Wait for Pages artifact to be available
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = context.runId;
            for (let attempt = 1; attempt <= 15; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id,
                per_page: 100,
              });
              if (data.artifacts.some((artifact) => artifact.name === 'github-pages' && !artifact.expired)) {
                core.info('Pages artifact is visible to the Actions API.');
                // Allow the Pages deployment service to see the newly indexed artifact, too.
                await new Promise((resolve) => setTimeout(resolve, 10000));
                return;
              }
              core.info(`Pages artifact not indexed yet (attempt ${attempt}/15).`);
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            core.setFailed('Pages artifact did not become visible within the retry window.');

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
