name: Update threat data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-threat-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh CISA KEV, NVD and EPSS intelligence
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/sync_data.py

      - name: Commit changed data, API outputs and RSS feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/threat-wall.json data/nvd-cache.json data/history.json \
            data/latest-movers.json data/new-since-yesterday.json data/vendors.json \
            data/weekly-summary.json data/api-index.json \
            feed/latest-movers.xml feed/new-kevs.xml feed/weekly-summary.xml
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh threat market data"
            git push
          fi
