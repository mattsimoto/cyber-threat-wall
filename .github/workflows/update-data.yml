name: Update threat data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/sync_data.py"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

concurrency:
  group: update-threat-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh CISA KEV and NVD enrichment
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/sync_data.py

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/threat-wall.json data/nvd-cache.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh threat data"
            git push
          fi
